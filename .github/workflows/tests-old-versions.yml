name: Test old versions
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Symfony 6.4 with PHP from 8.2 to 8.3
          - php-version: '8.2'
            symfony-version: '6.4'
          - php-version: '8.3'
            symfony-version: '6.4'

          # Symfony 7.4 with PHP from 8.2 to 8.4
          - php-version: '8.2'
            symfony-version: '7.4'
          - php-version: '8.3'
            symfony-version: '7.4'
          - php-version: '8.4'
            symfony-version: '7.4'

          # Symfony 8.0 with PHP 8.4
          - php-version: '8.4'
            symfony-version: '8.0'

    env:
      # Forces every symfony/* package (not just the ones we require directly) onto the
      # same branch, so composer can't silently mix e.g. framework-bundle 7.4 with
      # http-kernel 8.1. See symfony/flex's SYMFONY_REQUIRE support.
      SYMFONY_REQUIRE: '${{ matrix.symfony-version }}.*'

    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php-version }}'

      - name: Install Symfony Flex
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress symfony/flex

      - name: Install dependencies
        run: composer update --no-progress --no-suggest

      - name: Run tests
        run: vendor/bin/pest
